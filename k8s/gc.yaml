apiVersion: apps/v1
kind: Deployment
metadata:
  name: gc
  namespace: mini-mesh
  labels:
    app: gc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gc
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: gc
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: gc
          image: mini-mesh/gc:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50051
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gc
  namespace: mini-mesh
spec:
  selector:
    app: gc
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gc
  namespace: mini-mesh
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: gc
